
# Main Jostraca Configuration File
# --------------------------------
#
# NOTE 1: Settings may be overridden in the following order of precedence 
#         (low->high):
#         1. This config file (-F)
#         2. Auxiliary config files (-f)
#         3. Template script config file (pl.conf)
#         3. Template conf section (template.jtm)
#         4. Command line options (-Dsome.Option=aValue)
#
# NOTE 2: All values are equivalent to Java Strings. For example '\n' is 
#         converted into a newline. Hence, use '/' in all file paths.
#
# The default settings are java oriented - override in templates or
# template script config files (such as pl.conf) as appropriate for
# other languages.  Template script config files are loaded when
# template file names have the form: foo_bar.jtm or when the
# main.TemplateScript option is explicitly set in the template by the conf
# directive with "main.TemplateScript = bar" - both cases cause bar.conf
# to be loaded from the conf folder.

# General Settings
main.TemplateScript                   =   
main.OutputFolder                     =   .
main.WorkFolder                       =   $<main.OutputFolder>
main.FileNameRoot                     =   GeneratedFile
main.FileNamePrefix                   =
main.FileNameSuffix                   =   .java
main.BackupFolder                     =   $<main.MetaFolder>
main.BackupPrefix                     =   -
main.BackupSuffix                     =   -backup.txt
main.CodeWriter                       =   
main.CodeWriterPrefix                 =
main.CodeWriterSuffix                 =   .java
main.MetaFolder                       =   .jostraca

# !!
main.DefaultTemplateScript            =   java

# Control Settings
main.ExternalCompiler                 =   javac
main.ExternalCompilerOptions          =   
main.ExternalController               =   java
main.ExternalControllerOptions        =   
main.SaveCodeWriter                   =   yes

# yes: always, empty: only if needed, no: never
main.CompileCodeWriter                =   
# yes: always, empty: only if needed, no: never
main.ExecuteCodeWriter                =   

main.MakeBackup                       =   yes
main.CodeWriterFormat	                =   BasicJavaWriterFormat.jwf
main.EnableMeta                       =   yes


main.CodeWriterOptions                               =
main.CodeWriter.argument.ControlPrefix               = jsa:
main.CodeWriter.argument.name.OutputFolder           = o=
main.CodeWriter.argument.name.CodeWriterOutputFolder = O=
main.CodeWriter.argument.name.BackupFolder           = b=
main.CodeWriter.argument.name.NoBackup               = B


# CodeWriter Transforms
main.CodeWriterTransform.text   = $<lang.StringEscapeTransform>, TextElementTransform, AppendNewLineTransform
main.CodeWriterTransform.script = AppendNewLineTransform
main.CodeWriterTransform.expr   = ExpressionElementTransform, AppendNewLineTransform
main.CodeWriterTransform.insert-section = InsertSectionTransform


# Misc settings
main.TemplatePath        = $<main.DefaultTemplatePath>
main.DefaultTemplatePath = $<jostraca.Location>/templates/src
main.DumpTemplate        = no
main.DumpPropertySet     = no
main.ShowDocumentation   = no


# If defined at all, this takes precedence over includebase action
# The default if nothing is defined is "."
main.IncludeBase                      =   


# General language settings
lang.TextQuote                        =   "
lang.InsertPrefix                     =   _insert(
lang.InsertSuffix                     =   );
lang.CommentLinePrefix                =   //
lang.CommentLineSuffix                =
lang.CommentBlockPrefix               =   /*
lang.CommentBlockSuffix               =   */
lang.StringEscapeTransform            =   JavaStringEscapeTransform
lang.TemplateTextTransforms           =   $<jostraca.standard.TemplateTextTransforms>
lang.TemplateInsertTransforms         =   $<jostraca.standard.TemplateInsertTransforms>
lang.TemplateScriptTransforms         =   $<jostraca.standard.TemplateScriptTransforms>
lang.TemplateExpressionTransforms     =   $<jostraca.standard.TemplateExpressionTransforms>
lang.TemplateDirectiveTransforms      =   $<jostraca.standard.TemplateDirectiveTransforms>
lang.CodeWriterTransforms             =   SimpleIndentTransform
lang.section.all.Modifiers            =   BlockIndenter
lang.NameValueList.nameQuote          =   "
lang.NameValueList.itemSeparator      =   ,
lang.NameValueList.valueQuote         =   "
lang.NameValueList.pairSeparator      =   ,
lang.TrueString                       =   true
lang.FalseString                      =   false


# Template Parse Settings
#
parse.OpenOuterChar                   =   <
parse.OpenInnerChar                   =   %
parse.CloseInnerChar                  =   %
parse.CloseOuterChar                  =   >

# shortcuts
o  = $<parse.OpenOuterChar>$<parse.OpenInnerChar>
c  = $<parse.CloseInnerChar>$<parse.CloseOuterChar>
fs = $<jostraca.system.fileSeparator> 
ps = $<jostraca.system.pathSeparator> 

parse.Directives = $<jostraca.standard.Directives>, InsertSectionDirective, ReplaceDirective, ReplaceRegExpDirective

# <%=expression%>
parse.ExpressionMarker                =   =
# <% sectionName! script %>
parse.SectionMarker                   =   !
# <% @directive %>
parse.DirectiveMarker                 =   @
# <%! declarations %>
parse.DeclarationMarker               =   !

# regular expression escapes for parse characters, if necessary
parse.regexp.OpenOuterChar                   =   $<parse.OpenOuterChar>
parse.regexp.OpenInnerChar                   =   $<parse.OpenInnerChar>
parse.regexp.CloseInnerChar                  =   $<parse.CloseInnerChar>
parse.regexp.CloseOuterChar                  =   $<parse.CloseOuterChar>
parse.regexp.ExpressionMarker                =   $<parse.ExpressionMarker>
parse.regexp.SectionMarker                   =   $<parse.SectionMarker>
parse.regexp.DirectiveMarker                 =   $<parse.DirectiveMarker>
parse.regexp.DeclarationMarker               =   $<parse.DeclarationMarker>


# interface implementations
main.TemplateParser                   =   org.jostraca.BasicTemplateParser
main.CodeBuilder                      =   org.jostraca.BasicCodeBuilder
main.CodeWriterCompiler               =   org.jostraca.BasicJavaCodeWriterCompiler
main.CodeWriterController             =   org.jostraca.BasicJavaCodeWriterController


# Java specific settings
java.package                          =   
java.extends                          =   
java.implements                       =   
java.CodeWriter.package               =   $<java.package>
java.CodeWriter.extends               =   $<java.extends>
java.CodeWriter.implements            =   $<java.implements>

# use system classpath by default
java.ClassPath                        =
java.ClassPathPrefix                  =
java.ClassPathSuffix                  =



###############################################
# Jostraca internals - change at your own risk!
 
jostraca.version                      =   0.3
jostraca.strict.version               =   yes
jostraca.properties.modifiers         =   org.jostraca.NameValueListPSM
jostraca.LocalConfigFileName          =   local.conf

# jostraca.Location is used to find system files (writer formats, etc).
# If a relative reference is given, it is appended to the folder of
# this configuration file.
jostraca.Location                     =   ..

jostraca.FormatFolder                 = $<jostraca.Location>/format

jostraca.template.name                =
jostraca.template.path                =
jostraca.template.folder              = 

# set to lang.TrueString or lang.FalseString
jostraca.MakeBackup                   =

# set internally
jostraca.system.pathSeparator         =
jostraca.system.fileSeparator         =

# canonical language names
jostraca.TemplateScript.CanonicalName.c      = c

jostraca.TemplateScript.CanonicalName.perl   = perl
jostraca.TemplateScript.CanonicalName.pl     = $<jostraca.TemplateScript.CanonicalName.perl>

jostraca.TemplateScript.CanonicalName.python = python
jostraca.TemplateScript.CanonicalName.py     = $<jostraca.TemplateScript.CanonicalName.python>

jostraca.TemplateScript.CanonicalName.ruby   = ruby
jostraca.TemplateScript.CanonicalName.rb     = $<jostraca.TemplateScript.CanonicalName.ruby>

jostraca.TemplateScript.CanonicalName.rebol  = rebol
jostraca.TemplateScript.CanonicalName.r      = $<jostraca.TemplateScript.CanonicalName.rebol>

jostraca.TemplateScript.CanonicalName.java   = java
jostraca.TemplateScript.CanonicalName.jv     = $<jostraca.TemplateScript.CanonicalName.java>

# standard directives
jostraca.standard.Directives = SectionDirective, InitDirective, OneLineDirective, CollapseWhiteSpaceDirective

# standard transforms
jostraca.standard.TemplateTextTransforms       = 
jostraca.standard.TemplateInsertTransforms     = $<lang.StringEscapeTransform>, TextElementTransform, AppendNewLineTransform
jostraca.standard.TemplateScriptTransforms     = AppendNewLineTransform
jostraca.standard.TemplateExpressionTransforms = ExpressionElementTransform, AppendNewLineTransform
jostraca.standard.TemplateDirectiveTransforms  = 

# regular expressions
jostraca.regexp.AnyWhiteSpaceAtStart               = ^\\s*
jostraca.regexp.AnyWhiteSpace                      = \\s*
jostraca.regexp.SubmatchAnyWhiteSpaceAnyCharsAtEnd = (\\s*.*)$
jostraca.regexp.SubmatchSectionName                = ([a-zA-Z_\\.-][0-9a-zA-Z_\\.-]*)
jostraca.regexp.SubmatchDirectiveName              = ([a-zA-Z/_|\\.-][0-9a-zA-Z/_|\\.-]*)

jostraca.regexp.IsExpression    = $<jostraca.regexp.AnyWhiteSpaceAtStart>$<parse.regexp.ExpressionMarker>
jostraca.regexp.MatchExpression = $<jostraca.regexp.AnyWhiteSpaceAtStart>$<parse.regexp.ExpressionMarker>$<jostraca.regexp.SubmatchAnyWhiteSpaceAnyCharsAtEnd>

jostraca.regexp.MatchSectionName = $<jostraca.regexp.AnyWhiteSpaceAtStart>$<jostraca.regexp.SubmatchSectionName>$<parse.regexp.SectionMarker>$<jostraca.regexp.SubmatchAnyWhiteSpaceAnyCharsAtEnd>
jostraca.regexp.MatchDeclaration = $<jostraca.regexp.AnyWhiteSpaceAtStart>$<parse.regexp.DeclarationMarker>$<jostraca.regexp.SubmatchAnyWhiteSpaceAnyCharsAtEnd>

jostraca.regexp.IsDirective    = $<jostraca.regexp.AnyWhiteSpaceAtStart>$<parse.regexp.DirectiveMarker>
jostraca.regexp.MatchDirective = $<jostraca.regexp.AnyWhiteSpaceAtStart>$<parse.regexp.DirectiveMarker>$<jostraca.regexp.AnyWhiteSpace>$<jostraca.regexp.SubmatchDirectiveName>$<jostraca.regexp.SubmatchAnyWhiteSpaceAnyCharsAtEnd>

jostraca.regexp.template.ConfDirective         = $<parse.regexp.OpenOuterChar>$<parse.regexp.OpenInnerChar>\\s*$<parse.regexp.DirectiveMarker>\\s*conf\\s+(.+?)\\s*$<parse.regexp.CloseInnerChar>$<parse.regexp.CloseOuterChar>
jostraca.regexp.template.IncludeDirective      = $<parse.regexp.OpenOuterChar>$<parse.regexp.OpenInnerChar>\\s*$<parse.regexp.DirectiveMarker>\\s*include\\s+(\".+?\"|[^ ]+)\\s*([a-z- ]*)\\s*$<parse.regexp.CloseInnerChar>$<parse.regexp.CloseOuterChar>
jostraca.regexp.template.IncludeBaseDirective  = $<parse.regexp.OpenOuterChar>$<parse.regexp.OpenInnerChar>\\s*$<parse.regexp.DirectiveMarker>\\s*include-base\\s+[\\"']?(.+?)[\\"']?\\s*$<parse.regexp.CloseInnerChar>$<parse.regexp.CloseOuterChar>
jostraca.regexp.template.IncludeBlockDirective = $<parse.regexp.OpenOuterChar>$<parse.regexp.OpenInnerChar>\\s*$<parse.regexp.DirectiveMarker>\\s*include-block\\s+[\\"']?(.+?)[\\"']?\\s+/(.+?)/\\s*$<parse.regexp.CloseInnerChar>$<parse.regexp.CloseOuterChar>

