# python config file

main.CodeWriterSuffix             =   .py
main.CodeWriterFormat             =   BasicPythonWriterFormat.jwf
main.CodeWriterCompiler           =   org.jostraca.BasicCodeWriterCompiler
main.ExternalCompiler             =   
main.ExternalCompilerOptions      =   
main.CompileCodeWriter            =   no
main.CodeWriterController         =   org.jostraca.BasicCodeWriterController
main.ExternalController           =   python
main.ExternalControllerOptions    =  
main.ExecuteCodeWriter            =   yes

# important: preserves whitespace
lang.TemplateScriptTransforms     =   AppendNewLineTransform

lang.StringEscapeTransform        =   CStringEscapeTransform
lang.CodeWriterTransforms         =  
lang.section.all.Modifiers        =   PythonIndenter, BlockIndenter
lang.InsertPrefix                 =   "_py_insert( " 
lang.InsertSuffix                 =   " )"
lang.NameValueList.nameQuote      =   "
lang.NameValueList.itemSeparator  =   :
lang.NameValueList.valueQuote     =   "
lang.NameValueList.pairSeparator  =   ,
lang.TrueString                   =   1
lang.FalseString                  =   0

python.standardIndent             =   "  "
python.tabAsSpaces                =   "        "
python.nonStatementLineRegExp     =   ^[ \t]*(#.*)?$
python.controlFlowRegExp          =   :[ \t]*(#.*)?$

